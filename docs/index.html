<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8F5">
<meta name="description" content="Расписание ИОЗ-231: подтверждённые занятия, изменения и честный статус источников.">
<title>Расписание ИОЗ-231 · МГПУ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#171216;background:#fffdfd;font-synthesis:none;--ink:#171216;--secondary:#766b70;--red:#c70d1b;--red-dark:#a90917;--pink:#ffe5e8;--pink-soft:#fff3f4;--surface:#fff;--line:#f1e5e7}
*{box-sizing:border-box}body{margin:0;min-width:320px;overflow-x:hidden;background:radial-gradient(ellipse at 95% 17%,#fff3f4 0,transparent 36%),#fffdfd;color:var(--ink)}body:before{content:"";position:absolute;z-index:0;pointer-events:none;top:-335px;right:-155px;width:620px;height:620px;border:86px solid rgba(246,112,126,.11);border-radius:50%;clip-path:inset(0 0 32% 0)}
button{font:inherit;cursor:pointer}a{color:var(--red);text-underline-offset:3px}main{position:relative;z-index:1;max-width:1040px;margin:auto;padding:22px 24px calc(45px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:29px}.eyebrow{font-size:16px;font-weight:800;letter-spacing:.11em;color:var(--red);text-transform:uppercase;margin-bottom:13px}.appname{font-size:46px;letter-spacing:-.06em;font-weight:850;margin:0;line-height:1.08}header p{font-size:19px;color:#5d5458;margin:17px 0 0;line-height:1.45}.group{background:var(--pink);color:var(--red-dark);border:0;border-radius:19px;padding:16px 22px;font-size:21px;font-weight:800;white-space:nowrap;margin:24px 0 0}
.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.controls strong{font-size:25px;letter-spacing:-.035em;font-weight:800}.week-nav{display:flex;gap:9px}.icon-button,.today-button{height:55px;border:1px solid #eadde0;background:#fff;border-radius:17px;color:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #3a10120a}.icon-button{width:55px;font-size:32px;font-weight:500}.today-button{padding:0 21px;font-size:17px;font-weight:750}.icon-button:hover,.today-button:hover{background:var(--pink-soft)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:45px}.day{min-width:0;border:1px solid transparent;background:#f8f4f5;padding:16px 2px 12px;min-height:91px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#574e52}.day span{font-size:15px;font-weight:700}.day strong{font-size:27px;font-weight:800}.day i{height:4px;width:4px;border-radius:50%;background:#bcaeb2;display:block}.day.active{color:#fff;background:linear-gradient(145deg,#d20e1c,#b40816);box-shadow:0 8px 18px #bd071d24}.day.active i{background:#fff}.day.today:not(.active){border-color:#eab7bd}
.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:20px}.section-top h2{font-size:31px;font-weight:820;letter-spacing:-.045em;margin:0;line-height:1.2}.section-top small{font-size:17px;color:#6f6469;white-space:nowrap}.lessons{display:flex;flex-direction:column;gap:14px}.lesson{background:rgba(255,255,255,.94);border:1px solid #f0e6e8;border-radius:26px;padding:25px 24px;display:grid;grid-template-columns:124px minmax(0,1fr);gap:30px;box-shadow:0 8px 24px #2910150d}.lesson>div:first-child{border-right:2px solid #f0e5e7;padding:3px 22px 3px 2px}.lesson>div:nth-child(2){padding:2px 0}
.time-start{font-size:26px;font-weight:850;letter-spacing:-.05em;color:var(--red)}.time-end{font-size:16px;font-weight:560;color:#81767b;margin-top:6px}.subject{font-size:21px;font-weight:800;line-height:1.34;letter-spacing:-.03em;overflow-wrap:anywhere}.details{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{font-size:15px;font-weight:700;line-height:1.35;padding:7px 12px;border-radius:11px;background:#f4eff0;color:#51474b}.chip.room{background:var(--pink);color:var(--red-dark)}.teacher{font-size:16px;color:#70666a;line-height:1.5;margin-top:17px}.change-badge{margin-top:13px;display:inline-block;font-size:13px;font-weight:750;color:#8c5816;background:#fff2dc;padding:8px 10px;border-radius:9px}.lesson.cancelled{background:#faf8f8;opacity:.8}.cancelled .subject{text-decoration:line-through;text-decoration-color:#a4a6a2}.cancelled .time-start{text-decoration:line-through}.cancelled .change-badge{background:#fce6e4;color:#9f4840}
.alert{font-size:14px;line-height:1.55;padding:15px 17px;border-radius:15px;margin:0 0 22px;color:#75521e;background:#fff2df}.alert strong{display:block;margin-bottom:3px}.alert.danger{background:#fceae7;color:#97463c}.empty{background:#fff;border:1px dashed #eadfe1;border-radius:22px;padding:38px 22px;text-align:center}.empty .symbol{width:55px;height:55px;display:grid;place-items:center;font-size:24px;background:var(--pink-soft);border-radius:17px;margin:auto auto 14px}.empty strong{display:block;font-size:18px;letter-spacing:-.015em}.empty p{color:#7b7074;font-size:14px;line-height:1.6;margin:8px auto 0;max-width:310px}
.more{margin-top:32px}.more summary{cursor:pointer;font-size:14px;font-weight:750;color:var(--red-dark);list-style:none;padding:13px 0}.more summary::after{content:'⌄';margin-left:6px}.more[open] summary::after{content:'⌃'}.review{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px;font-size:13px;line-height:1.55;color:#5d5357}.review strong{color:#6f4f20;display:block;margin-bottom:3px}.review time{font-size:11px;color:#8a7e82}.review p{margin:8px 0}
.verification{margin:0 0 31px;display:flex;gap:10px;flex-wrap:wrap}.source-tag{font-size:14px;font-weight:750;color:var(--red-dark);background:var(--pink);padding:10px 14px;border-radius:14px}.source-tag.good{color:#a70d18;background:#ffe3e6}.source-tag.warn{color:#866021;background:#fff0d8}.source-tag.bad{color:#994b40;background:#fde6e2}
footer{border-top:1px solid #eee4e6;margin-top:39px;padding-top:19px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;color:#81777b;font-size:12px;line-height:1.8}.refresh{color:var(--red-dark);background:var(--pink);border:0;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:750;white-space:nowrap}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e38089;outline-offset:3px}
@media(max-width:700px){main{padding:20px 16px calc(42px + env(safe-area-inset-bottom))}body:before{top:-220px;right:-290px;width:470px;height:470px;border-width:65px}.eyebrow{font-size:11px;letter-spacing:.09em;margin-bottom:10px}.appname{font-size:36px}header p{font-size:15px;margin-top:11px}.group{font-size:15px;padding:12px 14px;border-radius:15px;margin-top:18px}.controls strong{font-size:19px}.icon-button,.today-button{height:43px;border-radius:14px}.icon-button{width:43px;font-size:27px}.today-button{padding:0 14px;font-size:14px}.days{gap:5px;margin-bottom:34px}.day{padding:12px 1px 9px;min-height:75px;border-radius:17px;gap:5px}.day span{font-size:12px}.day strong{font-size:21px}.section-top h2{font-size:26px}.section-top small{font-size:14px}.lesson{grid-template-columns:90px minmax(0,1fr);gap:16px;padding:19px 15px;border-radius:21px}.lesson>div:first-child{padding-right:14px}.time-start{font-size:21px}.time-end{font-size:13px}.subject{font-size:17px}.chip{font-size:12px;padding:6px 9px}.teacher{font-size:14px;margin-top:12px}.source-tag{font-size:12px;padding:8px 10px}}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}header{gap:8px}.appname{font-size:32px}header p{font-size:13px;max-width:230px}.group{font-size:13px;padding:10px 11px}.controls strong{font-size:16px}.week-nav{gap:5px}.icon-button{width:38px;height:40px}.today-button{height:40px;padding:0 10px;font-size:12px}.days{gap:3px}.day{min-height:68px;border-radius:14px;padding-top:10px}.day span{font-size:10px}.day strong{font-size:18px}.lesson{grid-template-columns:76px minmax(0,1fr);gap:12px;padding:16px 11px}.lesson>div:first-child{padding-right:10px}.time-start{font-size:18px}.time-end{font-size:12px}.subject{font-size:15px}.chip{font-size:11px;padding:5px 7px}.teacher{font-size:12px}}
</style>
</head>
<body><main>
  <header><div><div class="eyebrow">МГПУ · Институт гуманитарных наук</div><h1 class="appname">Расписание</h1><p>Проверенные данные и понятные предупреждения.</p></div><div class="group">ИОЗ-231</div></header>
  <div class="verification" id="verification" aria-label="Проверка источников"><span class="source-tag warn">Проверяем источники…</span></div>
  <section aria-label="Выбор даты"><div class="controls"><strong id="weekLabel">Загрузка…</strong><div class="week-nav"><button id="prev" class="icon-button" aria-label="Предыдущая неделя">‹</button><button id="today" class="today-button">Сегодня</button><button id="next" class="icon-button" aria-label="Следующая неделя">›</button></div></div><nav class="days" id="days" aria-label="Дни недели"></nav></section>
  <section aria-live="polite"><div class="section-top"><h2 id="dateTitle">Занятия</h2><small id="count"></small></div><div id="banner"></div><div id="lessons" class="lessons"></div></section>
  <details id="reviewSection" class="more" hidden><summary id="reviewLabel">Непроверенные изменения</summary><div id="reviews"></div></details>
  <footer><div><div id="updated">Источник данных загружается…</div><div>Неофициальное расписание. При сомнениях сверяй данные с деканатом.</div><div><a href="https://cloud.mail.ru/public/TKBt/bHWaZqMQA" target="_blank" rel="noopener">Таблица МГПУ</a> · <a href="https://vk.ru/dekanat_ign" target="_blank" rel="noopener">Изменения ВК</a></div></div><button class="refresh" id="refresh" title="Перезагрузить расписание">Обновить ↻</button></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'});
const shortFmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'});
const dnames=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longNames=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function todayMoscow(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${obj.year}-${obj.month}-${obj.day}`}
function date(s){return new Date(s+'T12:00:00Z')}
function iso(d){return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function daysFrom(s,n){const d=date(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function monday(s){const d=date(s);return daysFrom(s,-(d.getUTCDay()+6)%7)}
const h=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
let selected=todayMoscow(),schedule=null;
function plural(n){const a=n%10,b=n%100;return b>=11&&b<=14||a===0||a>=5?'занятий':a===1?'занятие':'занятия'}
function render(){
 const start=monday(selected),finish=daysFrom(start,6);
 $('weekLabel').textContent=`${shortFmt.format(date(start))} — ${shortFmt.format(date(finish))}`;
 const week=$('days');week.replaceChildren();const dateSet=new Set((schedule?.entries||[]).filter(x=>!x.cancelled).map(x=>x.date));
 for(let i=0;i<7;i++){
  const dt=daysFrom(start,i),current=dt===selected,btn=document.createElement('button');
  btn.className='day'+(current?' active':'')+(dt===todayMoscow()?' today':'');
  btn.setAttribute('aria-label',fmt.format(date(dt)));btn.setAttribute('aria-pressed',String(current));
  btn.innerHTML=`<span>${dnames[date(dt).getUTCDay()]}</span><strong>${date(dt).getUTCDate()}</strong><i style="visibility:${dateSet.has(dt)?'visible':'hidden'}"></i>`;
  btn.onclick=()=>{selected=dt;render()};week.append(btn);
 }
 const d=date(selected),wd=longNames[d.getUTCDay()];
 $('dateTitle').textContent=`${fmt.format(d)}`;
 const lessons=(schedule?.entries||[]).filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 $('count').textContent=lessons.length?`${lessons.length} ${plural(lessons.length)}`:'';
 let banner='';
 if(!schedule||schedule.status==='unavailable'){
  banner='<div class="alert danger"><strong>Не удалось загрузить расписание</strong>Проверь интернет и обнови страницу.</div>';
 }else if(!schedule.vk_ok){
  banner='<div class="alert"><strong>Изменения ВКонтакте пока не подключены</strong>Показано основное расписание из Excel. Переносы и отмены из постов пока не учитываются.</div>';
 }else if(schedule.source_live===false && (schedule.errors||[]).some(x=>x.startsWith('Источник Excel:'))){
  banner='<div class="alert"><strong>Excel пока не удалось перепроверить</strong>Показана последняя сохранённая версия исходного расписания. Новые правки самой таблицы могут отсутствовать.</div>';
 }else if(schedule.warnings?.length){
  banner=`<div class="alert"><strong>Есть замечания при загрузке</strong>${h(schedule.warnings[0])}</div>`;
 }else if(schedule.updated_at && Date.now()-new Date(schedule.updated_at).getTime()>48*3600*1000){
  banner='<div class="alert"><strong>Данные давно не обновлялись</strong>Проверка источников могла остановиться. Сверь изменения в паблике.</div>';
 }
 $('banner').innerHTML=banner;
 const list=$('lessons');list.replaceChildren();
 if(!lessons.length){
  let msg='На выбранную дату пар нет в исходной таблице.';
  if(!schedule?.entries?.length)msg='Данные ещё не загружены.';
  else if(selected<'2026-09-01'||selected>'2026-12-30')msg='В загруженном файле есть только расписание первого полугодия 2026–2027.';
  else if(selected>='2026-10-06'&&selected<='2026-11-02')msg='Этот период не включён в расписание занятий данного листа.';
  const empty=document.createElement('div');empty.className='empty';
  empty.innerHTML=`<div class="symbol" aria-hidden="true">☕</div><strong>Пар не найдено</strong><p>${h(msg)}</p>`;list.append(empty);
 }else for(const e of lessons){
  const el=document.createElement('article');el.className='lesson'+(e.cancelled?' cancelled':'');
  const flag=e.cancelled?'Отменена':e.changed?(e.previous_time?`Перенос с ${h(e.previous_time)}`:'Изменено'):'';
  const flagContent=flag?(e.change_url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(e.change_url)?`<a href="${e.change_url}" class="change-badge" target="_blank" rel="noopener">${flag} ↗</a>`:`<span class="change-badge">${flag}</span>`):'';
  el.innerHTML=`<div><div class="time-start">${h(e.time)}</div><div class="time-end">${e.end?h(e.end):'время уточняется'}</div></div><div><div class="subject">${h(e.subject)}</div><div class="details"><span class="chip">${h(e.kind||'Занятие')}</span>${e.room?`<span class="chip room">Ауд. ${h(e.room)}</span>`:''}</div>${e.teacher?`<div class="teacher">${h(e.teacher)}</div>`:''}${flagContent}</div>`;
  list.append(el);
 }
 const tags=[];
 if(!schedule||schedule.status==='unavailable'){
  tags.push('<span class="source-tag bad">Расписание недоступно</span>');
 }else{
  tags.push(schedule.source_live===true?'<span class="source-tag good">Excel: получен</span>':'<span class="source-tag warn">Excel: сохранённая версия</span>');
  tags.push(schedule.vk_ok===true?'<span class="source-tag good">VK: проверен</span>':'<span class="source-tag bad">VK: не проверен</span>');
  if((schedule.notices||[]).length)tags.push(`<span class="source-tag warn">Спорных изменений: ${schedule.notices.length}</span>`);
 }
 $('verification').innerHTML=tags.join('');
 const review=schedule?.notices||[];$('reviewSection').hidden=!review.length;$('reviewLabel').textContent=`Требуют проверки (${review.length})`;
 $('reviews').innerHTML=review.slice(0,30).map(x=>`<div class="review"><strong>${h(x.reason||'Изменение требует проверки')}</strong><p>${h(x.text||'')}</p>${x.url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(x.url)?`<a target="_blank" rel="noopener" href="${x.url}">Посмотреть пост ↗</a>`:''}</div>`).join('');
 $('updated').textContent=schedule?.updated_at?`Версия расписания: ${new Date(schedule.updated_at).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',year:'numeric'})}`:'Расписание ещё не проверялось';
}
async function load(){try{
 const embedded=$('embedded-data');
 if(location.protocol==='file:'&&embedded){schedule=JSON.parse(embedded.textContent)}
 else {let response=await fetch('./schedule.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);schedule=await response.json()}
 if(schedule.group!=='ИОЗ-231')throw Error('Загружена неверная группа');
}catch(err){console.error(err);schedule={group:'ИОЗ-231',status:'unavailable',entries:[],notices:[]};}render()}
$('prev').onclick=()=>{selected=daysFrom(selected,-7);render()};
$('next').onclick=()=>{selected=daysFrom(selected,7);render()};
$('today').onclick=()=>{selected=todayMoscow();render()};
$('refresh').onclick=load;load();
</script>
</body></html>

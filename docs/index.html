async function fetchSchedule(){

function load(){

  let ok=false;
  try{
   const next=await fetchSchedule();
   if(!usableSchedule(next))throw Error('Расписание недоступно или некорректно');
   const hadContent=$('lessons').childElementCount>0;
   schedule=next;refreshError=false;
   const changed=render();writeScheduleCache(next);if(hadContent&&changed)animateLessons();
   ok=true;
  }catch(err){

   button.disabled=false;button.textContent='Обновить ↻';button.removeAttribute('aria-busy');

function playMonthFold(fold,oldHeight,lessonsChanged){

 run(fold.layer,[{opacity:1},{opacity:0}],{duration:180,easing:'ease-out',fill:'both'});

  const number=button.querySelector('strong'),dot=button.querySelector('i'),label=button.querySelector('span'),from=fold.positions.get(button.dataset.date);
  if(label)run(label,[{opacity:0},{opacity:1}],{duration:180,delay:90,easing:'ease-out',fill:'both'});

   const to=number.getBoundingClientRect(),toDot=dot.getBoundingClientRect();

  }else{

   run(dot,[{opacity:0},{opacity:1}],{duration:190,delay:90,easing,fill:'both'});

function prepareCalendarAnimation(){const height=$('calendarBody').getBoundingClientRect().height;cancelCalendarAnimations();return height}

}
function animateLessons(){
 const list=$('lessons'),now=performance.now(),rapid=now-lastLessonMotion<220;lastLessonMotion=now;
 cancelLessonMotion();
 if(rapid||reducedMotion()||typeof list.animate!=='function')return;

}
function selectDate(dt,restoreFocus=false){
 if(dt===selected&&!expanded)return;
 const wasExpanded=expanded,changed=dt!==selected,previous=selected,origin=!expanded?selectionOrigin():null;
 const adjacent=!expanded&&monday(dt)===monday(previous)&&Math.abs((date(dt)-date(previous))/86400000)===1;
 const height=prepareCalendarAnimation(),fold=wasExpanded?captureMonthFold(dt):null;
 selected=dt;expanded=false;viewMonth=selected.slice(0,7)+'-01';saveSelectedDate();if(changed)haptic();const contentChanged=render();
 if(fold)playMonthFold(fold,height,contentChanged);
 else{
  if(wasExpanded)animateCalendar(0,height);
  if(changed){animateSelection(origin,adjacent);if(contentChanged)animateLessons()}

 if(restoreFocus)$('days').querySelector('[data-date="'+selected+'"]')?.focus({preventScroll:true});
}
function navigateWeek(delta,drag=0){

 viewMonth=selected.slice(0,7)+'-01';saveSelectedDate();haptic();const changed=render();
 animateCalendar(delta,height,drag?Math.min(72,32+Math.abs(drag)*.35):32);if(changed)animateLessons();
}
function navigateMonth(delta){
 if(!expanded)return;
 const target=monthShift(viewMonth,delta);
 if(!findMonthPanel(target))extendMonths(delta<0);
 viewMonth=target;scrollToMonth(target,true);updateCalendarControls();
}
$('prev').onclick=()=>navigateWeek(-1);

$('today').onclick=()=>selectDate(todayMoscow());
$('monthPrev').onclick=()=>navigateMonth(-1);

function setMonthExpanded(value){
 if(expanded===value)return;

const monthButton=$('monthToggle');

function calendarKeydown(e){
 if(expanded&&(e.key==='PageUp'||e.key==='PageDown')){
  e.preventDefault();navigateMonth(e.key==='PageUp'?-1:1);
  findMonthPanel(viewMonth)?.querySelector('.day:not(.outside)')?.focus({preventScroll:true});return;
 }
 const current=e.target.closest('[data-date]');
 if(!current)return;
 const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
 if(!Object.hasOwn(offsets,e.key))return;
 const target=daysFrom(current.dataset.date,offsets[e.key]);
 const region=expanded?$('monthScroll'):$('days');
 const matches=[...region.querySelectorAll('[data-date="'+target+'"]')];

$('days').addEventListener('keydown',calendarKeydown);
$('monthScroll').addEventListener('keydown',calendarKeydown);
let swipe=null,suppressTapUntil=0;
function dragWeek(dx){
 const limit=Math.min(96,$('days').clientWidth*.30),abs=Math.abs(dx);
 return Math.sign(dx)*(abs<=limit?abs:limit+Math.min(24,(abs-limit)*.15));
}
function endWeekDrag(commit=false,dx=0){
 const current=swipe;swipe=null;
 if(!current||current.axis!=='horizontal')return;
 const offset=current.offset||0;

 else clearWeekMotion();
}
$('days').addEventListener('touchstart',e=>{
 if(swipe)endWeekDrag();suppressTapUntil=0;
 swipe=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,axis:null,offset:0,start:performance.now()}:null;
},{passive:true});
$('days').addEventListener('touchmove',e=>{

},{passive:true});

$('days').addEventListener('touchcancel',()=>{endWeekDrag();swipe=null},{passive:true});
$('days').addEventListener('click',e=>{if(e.detail!==0&&Date.now()<suppressTapUntil){e.preventDefault();e.stopPropagation()}},true);
$('refresh').onclick=()=>startRefresh(window.scrollY<=1);
let lastCalendarToday=todayMoscow();
function updateCalendarToday(){
 const current=todayMoscow();if(current===lastCalendarToday)return;

 if(wasToday){selected=current;viewMonth=current.slice(0,7)+'-01';saveSelectedDate();render()}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateCalendarToday();if(Date.now()-lastFetchAttempt>=60000&&!refreshBusy)load()}});

setInterval(()=>{if(!document.hidden)updateCalendarToday()},60000);

/* Pull to refresh reloads the document and its schedule; the footer refreshes data only. */
const refreshIndicator=$('pullRefresh'),refreshArc=refreshIndicator.querySelector('.ring-progress');
const REFRESH_THRESHOLD=80,REFRESH_HOLD=46,REFRESH_CIRC=2*Math.PI*12;
let refreshBusy=false,pullGesture=null,pullSuppressUntil=0,refreshCollapseTimer=0;

function setRefreshProgress(value){

   if(url.protocol==='http:'||url.protocol==='https:'){

   }else window.location.reload();

  }

function canPull(target){

document.addEventListener('touchstart',event=>{

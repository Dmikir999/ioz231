<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8F5">
<meta name="description" content="Расписание ИОЗ-231: подтверждённые занятия, изменения и честный статус источников.">
<title>Расписание ИОЗ-231 · МГПУ</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1D2C25;background:#F7F8F5;font-synthesis:none;--ink:#1D2C25;--secondary:#7A857D;--green:#254C38;--surface:#fff;--line:#E4E9E2}
*{box-sizing:border-box}body{margin:0;min-width:320px}button{font:inherit;cursor:pointer}a{color:#356448;text-underline-offset:3px}main{max-width:660px;margin:auto;padding:30px 20px calc(45px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:31px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.09em;color:#6E8371;text-transform:uppercase;margin-bottom:8px}.appname{font-size:31px;letter-spacing:-.055em;font-weight:790;margin:0;line-height:1.13}header p{font-size:13px;color:#77837A;margin:9px 0 0;line-height:1.45}.group{background:#E7EFE8;color:#2A563D;border:1px solid #D8E7DB;border-radius:13px;padding:10px 13px;font-size:14px;font-weight:760;white-space:nowrap;margin-top:18px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.controls strong{font-size:16px;letter-spacing:-.02em}.week-nav{display:flex;gap:7px}.icon-button,.today-button{height:35px;border:1px solid #E2E7DF;background:#fff;border-radius:11px;color:#385B44;display:flex;align-items:center;justify-content:center}.icon-button{width:35px;font-size:23px;font-weight:400}.today-button{padding:0 12px;font-size:12px;font-weight:700}.icon-button:hover,.today-button:hover{background:#E9F0E8}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:30px}.day{min-width:0;border:1px solid transparent;background:#F0F2ED;padding:11px 1px 9px;min-height:69px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#647169}.day span{font-size:11px;font-weight:650}.day strong{font-size:17px;font-weight:750}.day i{height:3px;width:3px;border-radius:50%;background:#97AB98;display:block}.day.active{color:#fff;background:#2B543E;box-shadow:0 4px 12px #2B543E20}.day.active i{background:#D7E9DC}.day.today:not(.active){border-color:#A9C5AF}
.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:17px}.section-top h2{font-size:23px;font-weight:760;letter-spacing:-.04em;margin:0;line-height:1.2}.section-top small{font-size:12px;color:#839086;white-space:nowrap}
.lessons{display:flex;flex-direction:column;gap:10px}.lesson{background:#fff;border:1px solid #E9EDE6;border-radius:17px;padding:19px 17px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;box-shadow:0 2px 8px #233b2710}.time-start{font-size:19px;font-weight:800;letter-spacing:-.04em;color:#294B37}.time-end{font-size:12px;font-weight:560;color:#8C9890;margin-top:5px}.subject{font-size:16px;font-weight:730;line-height:1.34;letter-spacing:-.025em;overflow-wrap:anywhere}.details{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.chip{font-size:11px;font-weight:680;line-height:1.35;padding:5px 8px;border-radius:7px;background:#F2F4F0;color:#617368}.chip.room{background:#EAF2E9;color:#366A45}.teacher{font-size:12.5px;color:#737F77;line-height:1.5;margin-top:12px}.change-badge{margin-top:11px;display:inline-block;font-size:11px;font-weight:750;color:#98611A;background:#FCF2E4;padding:7px 8px;border-radius:8px}.lesson.cancelled{background:#FAF9F8;opacity:.8}.cancelled .subject{text-decoration:line-through;text-decoration-color:#A4A6A2}.cancelled .time-start{text-decoration:line-through}.cancelled .change-badge{background:#FCE6E4;color:#9F4840}
.alert{font-size:12.5px;line-height:1.55;padding:13px 15px;border-radius:12px;margin:0 0 21px;color:#75521E;background:#FFF2DF}.alert strong{display:block;margin-bottom:3px}.alert.danger{background:#FCEAE7;color:#97463C}.empty{background:#fff;border:1px dashed #DEE5DB;border-radius:18px;padding:35px 22px;text-align:center}.empty .symbol{width:51px;height:51px;display:grid;place-items:center;font-size:23px;background:#EFF3EC;border-radius:15px;margin:auto auto 14px}.empty strong{display:block;font-size:16px;letter-spacing:-.015em}.empty p{color:#7B887D;font-size:13px;line-height:1.6;margin:8px auto 0;max-width:290px}
.more{margin-top:31px}.more summary{cursor:pointer;font-size:13px;font-weight:750;color:#3E6951;list-style:none;padding:13px 0}.more summary::after{content:'⌄';margin-left:6px}.more[open] summary::after{content:'⌃'}.review{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;font-size:12px;line-height:1.55;color:#5D695F}.review strong{color:#6F4F20;display:block;margin-bottom:3px}.review time{font-size:11px;color:#8A978A}.review p{margin:8px 0}
.verification{margin:-17px 0 24px;display:flex;gap:7px;flex-wrap:wrap}.source-tag{font-size:11px;font-weight:650;color:#65736A;background:#EEF2ED;padding:7px 9px;border-radius:9px}.source-tag.good{color:#2F6846;background:#E3F1E6}.source-tag.warn{color:#866021;background:#FFF0D8}.source-tag.bad{color:#994B40;background:#FDE6E2}footer{border-top:1px solid #DEE4DD;margin-top:39px;padding-top:19px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;color:#859185;font-size:11.5px;line-height:1.8}.refresh{color:#2F6144;background:#E6F0E7;border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;white-space:nowrap}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #82B78A;outline-offset:3px}
@media(max-width:420px){main{padding:24px 14px 50px}.appname{font-size:29px}.group{font-size:12px}.lesson{grid-template-columns:81px minmax(0,1fr);padding:17px 13px;gap:8px}.time-start{font-size:17px}.subject{font-size:15px}.day{padding:10px 0;min-height:66px}.days{gap:3px}}
</style>
</head>
<body><main>
  <header><div><div class="eyebrow">МГПУ · Институт гуманитарных наук</div><h1 class="appname">Расписание</h1><p>Проверенные данные и понятные предупреждения.</p></div><div class="group">ИОЗ-231</div></header>
  <div class="verification" id="verification" aria-label="Проверка источников"><span class="source-tag warn">Проверяем источники…</span></div>
  <section aria-label="Выбор даты"><div class="controls"><strong id="weekLabel">Загрузка…</strong><div class="week-nav"><button id="prev" class="icon-button" aria-label="Предыдущая неделя">‹</button><button id="today" class="today-button">Сегодня</button><button id="next" class="icon-button" aria-label="Следующая неделя">›</button></div></div><nav class="days" id="days" aria-label="Дни недели"></nav></section>
  <section aria-live="polite"><div class="section-top"><h2 id="dateTitle">Занятия</h2><small id="count"></small></div><div id="banner"></div><div id="lessons" class="lessons"></div></section>
  <details id="reviewSection" class="more" hidden><summary id="reviewLabel">Непроверенные изменения</summary><div id="reviews"></div></details>
  <footer><div><div id="updated">Источник данных загружается…</div><div>Неофициальное расписание. При сомнениях сверяй данные с деканатом.</div><div><a href="https://cloud.mail.ru/public/TKBt/bHWaZqMQA" target="_blank" rel="noopener">Таблица МГПУ</a> · <a href="https://vk.ru/dekanat_ign" target="_blank" rel="noopener">Изменения ВК</a></div></div><button class="refresh" id="refresh" title="Перезагрузить расписание">Обновить ↻</button></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'});
const shortFmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'});
const dnames=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longNames=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function todayMoscow(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${obj.year}-${obj.month}-${obj.day}`}
function date(s){return new Date(s+'T12:00:00Z')}
function iso(d){return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function daysFrom(s,n){const d=date(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function monday(s){const d=date(s);return daysFrom(s,-(d.getUTCDay()+6)%7)}
const h=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
let selected=todayMoscow(),schedule=null;
function plural(n){const a=n%10,b=n%100;return b>=11&&b<=14||a===0||a>=5?'занятий':a===1?'занятие':'занятия'}
function render(){
 const start=monday(selected),finish=daysFrom(start,6);
 $('weekLabel').textContent=`${shortFmt.format(date(start))} — ${shortFmt.format(date(finish))}`;
 const week=$('days');week.replaceChildren();const dateSet=new Set((schedule?.entries||[]).filter(x=>!x.cancelled).map(x=>x.date));
 for(let i=0;i<7;i++){
  const dt=daysFrom(start,i),current=dt===selected,btn=document.createElement('button');
  btn.className='day'+(current?' active':'')+(dt===todayMoscow()?' today':'');
  btn.setAttribute('aria-label',fmt.format(date(dt)));btn.setAttribute('aria-pressed',String(current));
  btn.innerHTML=`<span>${dnames[date(dt).getUTCDay()]}</span><strong>${date(dt).getUTCDate()}</strong><i style="visibility:${dateSet.has(dt)?'visible':'hidden'}"></i>`;
  btn.onclick=()=>{selected=dt;render()};week.append(btn);
 }
 const d=date(selected),wd=longNames[d.getUTCDay()];
 $('dateTitle').textContent=`${fmt.format(d)}`;
 const lessons=(schedule?.entries||[]).filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 $('count').textContent=lessons.length?`${lessons.length} ${plural(lessons.length)}`:'';
 let banner='';
 if(!schedule||schedule.status==='unavailable'){
  banner='<div class="alert danger"><strong>Не удалось загрузить расписание</strong>Проверь интернет и обнови страницу.</div>';
 }else if(!schedule.vk_ok){
  banner='<div class="alert"><strong>Изменения ВКонтакте пока не подключены</strong>Показано основное расписание из Excel. Переносы и отмены из постов пока не учитываются.</div>';
 }else if(schedule.source_live===false && (schedule.errors||[]).some(x=>x.startsWith('Источник Excel:'))){
  banner='<div class="alert"><strong>Excel пока не удалось перепроверить</strong>Показана последняя сохранённая версия исходного расписания. Новые правки самой таблицы могут отсутствовать.</div>';
 }else if(schedule.warnings?.length){
  banner=`<div class="alert"><strong>Есть замечания при загрузке</strong>${h(schedule.warnings[0])}</div>`;
 }else if(schedule.updated_at && Date.now()-new Date(schedule.updated_at).getTime()>48*3600*1000){
  banner='<div class="alert"><strong>Данные давно не обновлялись</strong>Проверка источников могла остановиться. Сверь изменения в паблике.</div>';
 }
 $('banner').innerHTML=banner;
 const list=$('lessons');list.replaceChildren();
 if(!lessons.length){
  let msg='На выбранную дату пар нет в исходной таблице.';
  if(!schedule?.entries?.length)msg='Данные ещё не загружены.';
  else if(selected<'2026-09-01'||selected>'2026-12-30')msg='В загруженном файле есть только расписание первого полугодия 2026–2027.';
  else if(selected>='2026-10-06'&&selected<='2026-11-02')msg='Этот период не включён в расписание занятий данного листа.';
  const empty=document.createElement('div');empty.className='empty';
  empty.innerHTML=`<div class="symbol" aria-hidden="true">☕</div><strong>Пар не найдено</strong><p>${h(msg)}</p>`;list.append(empty);
 }else for(const e of lessons){
  const el=document.createElement('article');el.className='lesson'+(e.cancelled?' cancelled':'');
  const flag=e.cancelled?'Отменена':e.changed?(e.previous_time?`Перенос с ${h(e.previous_time)}`:'Изменено'):'';
  const flagContent=flag?(e.change_url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(e.change_url)?`<a href="${e.change_url}" class="change-badge" target="_blank" rel="noopener">${flag} ↗</a>`:`<span class="change-badge">${flag}</span>`):'';
  el.innerHTML=`<div><div class="time-start">${h(e.time)}</div><div class="time-end">${e.end?h(e.end):'время уточняется'}</div></div><div><div class="subject">${h(e.subject)}</div><div class="details"><span class="chip">${h(e.kind||'Занятие')}</span>${e.room?`<span class="chip room">Ауд. ${h(e.room)}</span>`:''}</div>${e.teacher?`<div class="teacher">${h(e.teacher)}</div>`:''}${flagContent}</div>`;
  list.append(el);
 }
 const tags=[];
 if(!schedule||schedule.status==='unavailable'){
  tags.push('<span class="source-tag bad">Расписание недоступно</span>');
 }else{
  tags.push(schedule.source_live===true?'<span class="source-tag good">Excel: получен</span>':'<span class="source-tag warn">Excel: сохранённая версия</span>');
  tags.push(schedule.vk_ok===true?'<span class="source-tag good">VK: проверен</span>':'<span class="source-tag bad">VK: не проверен</span>');
  if((schedule.notices||[]).length)tags.push(`<span class="source-tag warn">Спорных изменений: ${schedule.notices.length}</span>`);
 }
 $('verification').innerHTML=tags.join('');
 const review=schedule?.notices||[];$('reviewSection').hidden=!review.length;$('reviewLabel').textContent=`Требуют проверки (${review.length})`;
 $('reviews').innerHTML=review.slice(0,30).map(x=>`<div class="review"><strong>${h(x.reason||'Изменение требует проверки')}</strong><p>${h(x.text||'')}</p>${x.url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(x.url)?`<a target="_blank" rel="noopener" href="${x.url}">Посмотреть пост ↗</a>`:''}</div>`).join('');
 $('updated').textContent=schedule?.updated_at?`Версия расписания: ${new Date(schedule.updated_at).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',year:'numeric'})}`:'Расписание ещё не проверялось';
}
async function load(){try{
 const embedded=$('embedded-data');
 if(location.protocol==='file:'&&embedded){schedule=JSON.parse(embedded.textContent)}
 else {let response=await fetch('./schedule.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);schedule=await response.json()}
 if(schedule.group!=='ИОЗ-231')throw Error('Загружена неверная группа');
}catch(err){console.error(err);schedule={group:'ИОЗ-231',status:'unavailable',entries:[],notices:[]};}render()}
$('prev').onclick=()=>{selected=daysFrom(selected,-7);render()};
$('next').onclick=()=>{selected=daysFrom(selected,7);render()};
$('today').onclick=()=>{selected=todayMoscow();render()};
$('refresh').onclick=load;load();
</script>
</body></html>

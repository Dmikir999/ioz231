</div></main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'});
const shortFmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'});
const dnames=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longNames=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function todayMoscow(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${obj.year}-${obj.month}-${obj.day}`}
function date(s){return new Date(s+'T12:00:00Z')}
function iso(d){return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function daysFrom(s,n){const d=date(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function monday(s){const d=date(s);return daysFrom(s,-(d.getUTCDay()+6)%7)}
const h=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const uiIcons={"practice":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 5 4 4M4 20l4.5-1 12-12a2.8 2.8 0 0 0-4-4l-12 12L4 20Z\"/></svg>","lecture":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 6c-2.5-2-6-2-10-1v14c4-1 7.5-1 10 1 2.5-2 6-2 10-1V5c-4-1-7.5-1-10 1v14\"/></svg>","room":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>","teacher":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M3 21v-2a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v2Z\"/></svg>","other":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M9 8h6m-6 4h6m-6 4h4\"/></svg>"};
const monthFmt=new Intl.DateTimeFormat('ru-RU',{month:'long',timeZone:'UTC'});
const monthShort=new Intl.DateTimeFormat('ru-RU',{month:'short',timeZone:'UTC'});
const capitalize=s=>s.charAt(0).toUpperCase()+s.slice(1);
function calendarLabel(selected,expanded,viewMonth){
 const shown=date(expanded?viewMonth:selected);
 if(expanded)return {text:capitalize(monthFmt.format(shown))+' '+shown.getUTCFullYear(),range:false};
 const first=date(monday(selected)),last=date(daysFrom(monday(selected),6));
 if(first.getUTCMonth()===last.getUTCMonth())return {text:capitalize(monthFmt.format(shown))+' '+shown.getUTCFullYear(),range:false};
 const firstYear=first.getUTCFullYear(),lastYear=last.getUTCFullYear();
 return {text:capitalize(monthShort.format(first))+(firstYear!==lastYear?' '+String(firstYear).slice(-2):'')+' – '+monthShort.format(last)+' '+(firstYear===lastYear?lastYear:String(lastYear).slice(-2)),range:true,title:capitalize(monthFmt.format(first))+' '+firstYear+' — '+monthFmt.format(last)+' '+lastYear};
}
function kindIcon(kind){return /практик|семинар|лаборатор/i.test(kind||'')?uiIcons.practice:/лекци/i.test(kind||'')?uiIcons.lecture:uiIcons.other}

const selectedStorageKey='ioz231:selectedDate',hintStorageKey='ioz231:monthSwipeLearned';
function readSavedDate(){
 try{const value=sessionStorage.getItem(selectedStorageKey);if(value&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&iso(date(value))===value)return value}catch{}
 return todayMoscow();
}
function saveSelectedDate(){try{sessionStorage.setItem(selectedStorageKey,selected)}catch{}}
let monthSwipeLearned=false;
try{monthSwipeLearned=localStorage.getItem(hintStorageKey)==='1'}catch{}
function rememberMonthSwipe(){monthSwipeLearned=true;try{localStorage.setItem(hintStorageKey,'1')}catch{}}
let selected=readSavedDate(),schedule=null,expanded=false,viewMonth=selected.slice(0,7)+'-01';
function plural(n){const a=n%10,b=n%100;return b>=11&&b<=14||a===0||a>=5?'занятий':a===1?'занятие':'занятия'}

function monthShift(s,delta){const d=date(s);return iso(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+delta,1,12)))}
function renderCalendar(){
 const selectedDate=date(selected), shown=expanded?date(viewMonth):selectedDate;
 const label=calendarLabel(selected,expanded,viewMonth),labelEl=$('weekLabel');
 labelEl.textContent=label.text;labelEl.classList.toggle('range-label',label.range);
 labelEl.title=label.title||label.text;
 const todayButton=$('today'),isCurrent=selected===todayMoscow()&&(!expanded||viewMonth===selected.slice(0,7)+'-01');
 todayButton.classList.toggle('is-current',isCurrent);todayButton.disabled=isCurrent;
 $('monthToggle').setAttribute('aria-expanded',String(expanded));
 $('monthToggle').setAttribute('aria-label',expanded?'Свернуть календарь месяца':'Раскрыть календарь месяца');
 $('calendarHandle').setAttribute('aria-expanded',String(expanded));
 $('calendarHandle').setAttribute('aria-label',expanded?'Свернуть календарь месяца':'Раскрыть календарь месяца');
 $('monthTools').hidden=!expanded;
 $('monthHint').hidden=true;
 const week=$('days');week.replaceChildren();week.classList.toggle('month-view',expanded);week.setAttribute('aria-label',expanded?'Дни месяца':'Дни недели');
 const dateSet=new Set((schedule?.entries||[]).filter(x=>!x.cancelled).map(x=>x.date));
 const now=todayMoscow(), start=monday(expanded?viewMonth:selected);
 const total=expanded?Math.ceil(((shown.getUTCDay()+6)%7+new Date(Date.UTC(shown.getUTCFullYear(),shown.getUTCMonth()+1,0)).getUTCDate())/7)*7:7;
 if(expanded)for(const name of ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']){const el=document.createElement('span');el.className='month-weekday';el.textContent=name;week.append(el)}
 for(let i=0;i<total;i++){
  const dt=daysFrom(start,i),current=dt===selected,btn=document.createElement('button'),dd=date(dt);
  btn.type='button';btn.className='day'+(current?' active':'')+(dt===now?' today':'')+(expanded&&dd.getUTCMonth()!==shown.getUTCMonth()?' outside':'');
  btn.dataset.date=dt;btn.setAttribute('aria-label',fmt.format(dd)+' '+dd.getUTCFullYear()+(dateSet.has(dt)?', есть занятия':''));btn.setAttribute('aria-pressed',String(current));if(dt===now)btn.setAttribute('aria-current','date');
  btn.innerHTML=(expanded?'': '<span>'+dnames[dd.getUTCDay()]+'</span>')+'<strong>'+dd.getUTCDate()+'</strong><i style="visibility:'+(dateSet.has(dt)?'visible':'hidden')+'"></i>';
  btn.onclick=e=>selectDate(dt,e.detail===0);week.append(btn);
 }

}

function render(){
 if (/^https:\/\/cloud\.mail\.ru\/public\/[\w-]+\/[\w-]+$/.test(schedule?.source)) {
  document.querySelectorAll('[data-source-link]').forEach(link=>{link.href=schedule.source});
 }
 renderCalendar();
 const d=date(selected),wd=longNames[d.getUTCDay()];
 $('dateTitle').textContent=`${fmt.format(d)}`;
 const lessons=(schedule?.entries||[]).filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 const semesterStart=schedule?.semester_start||'';
 const semesterEnd=schedule?.semester_end||'';
 const finalBySubject=new Map();
 for(const entry of schedule?.entries||[]){
  if(entry.cancelled||!entry.subject||!entry.date)continue;
  if((semesterStart&&entry.date<semesterStart)||(semesterEnd&&entry.date>semesterEnd))continue;
  const key=String(entry.subject).trim().replace(/\s+/g,' ').toLocaleLowerCase('ru-RU');
  const previous=finalBySubject.get(key);
  if(!previous||entry.date>previous.date||(entry.date===previous.date&&String(entry.time||'')>String(previous.time||'')))finalBySubject.set(key,entry);
 }
 const groups=new Map();
 const cards=[];
 for(const e of lessons){
  const key=e.parallel_id && JSON.stringify([e.parallel_id,e.time,e.end]);
  if(key && groups.has(key)){
   groups.get(key).push(e);
  }else{
   const variants=[e];
   cards.push(variants);
   if(key)groups.set(key,variants);
  }
 }
 $('count').textContent=cards.length?`${cards.length} ${plural(cards.length)}`:'';
 let banner='';
 if(!schedule||schedule.status==='unavailable'){
  banner='<div class="alert danger"><strong>Не удалось загрузить расписание</strong>Проверь интернет и обнови страницу.</div>';
 }else if(!schedule.vk_ok){
  banner='<div class="alert"><strong>Изменения ВКонтакте пока не подключены</strong>Показано основное расписание из Excel. Переносы и отмены из постов пока не учитываются.</div>';
 }else if(schedule.source_live===false && (schedule.errors||[]).some(x=>x.startsWith('Источник Excel:'))){
  banner='<div class="alert"><strong>Excel пока не удалось перепроверить</strong>Показана последняя сохранённая версия исходного расписания. Новые правки самой таблицы могут отсутствовать.</div>';
 }else if(schedule.warnings?.length){
  banner=`<div class="alert"><strong>Есть замечания при загрузке</strong>${h(schedule.warnings[0])}</div>`;
 }else if(schedule.updated_at && Date.now()-new Date(schedule.updated_at).getTime()>48*3600*1000){
  banner='<div class="alert"><strong>Данные давно не обновлялись</strong>Проверка источников могла остановиться. Сверь изменения в паблике.</div>';
 }
 $('banner').innerHTML=banner;
 const list=$('lessons');list.replaceChildren();
 if(!lessons.length){
  let msg='На выбранную дату пар нет в исходной таблице.';
  if(!schedule?.entries?.length)msg='Данные ещё не загружены.';
  else if(selected<semesterStart||selected>semesterEnd)msg='Эта дата за пределами загруженного семестра.';
  else if(schedule.periods && !schedule.periods.some(([a,b])=>a<=selected && selected<=b))msg='Перерыв в занятиях по учебному календарю.';
  const empty=document.createElement('div');empty.className='empty';
  empty.innerHTML=`<div class="symbol" aria-hidden="true">☕</div><strong>Пар не найдено</strong><p>${h(msg)}</p>`;list.append(empty);
 }else for(const variants of cards){
  const e=variants[0];
  const el=document.createElement('article');
  el.className='lesson'+(variants.every(v=>v.cancelled)?' cancelled':'');
  const sections=variants.map(e=>{
  const subjectKey=String(e.subject||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru-RU');
  const finalBadge=!e.cancelled&&finalBySubject.get(subjectKey)===e?'<div class="final-semester-badge">Заключительная пара в семестре</div>':'';
  const previousSlot=e.previous_date&&e.previous_date!==e.date
   ?`${shortFmt.format(date(e.previous_date))}, ${e.previous_time}`:e.previous_time;
  let flag='';
  if(e.cancelled)flag='Отменена';
  else if(previousSlot)flag=`Перенос с ${previousSlot}`;
  else if(e.previous_room)flag=`Смена аудитории: ${e.previous_room} → ${e.room}`;
  else if(e.previous_room===''&&e.room)flag=`Новая аудитория: ${e.room}`;
  else if(e.changed)flag='Изменено';
  const flagContent=flag?(e.change_url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(e.change_url)?`<a href="${e.change_url}" class="change-badge" target="_blank" rel="noopener">${h(flag)} ↗</a>`:`<span class="change-badge">${h(flag)}</span>`):'';
  return `<section class="lesson-option"><div class="subject">${h(e.subject)}</div><div class="details"><span class="chip">${kindIcon(e.kind)}${h(e.kind||'Занятие')}</span>${e.room?`<span class="chip room">${uiIcons.room}Ауд. ${h(e.room)}</span>`:''}</div>${e.teacher?`<div class="teacher">${uiIcons.teacher}<span>${h(e.teacher)}</span></div>`:''}${flagContent}${finalBadge}</section>`;
  }).join('');
  el.innerHTML=`<div><div class="time-start">${h(e.time)}</div><div class="time-end">${e.end?h(e.end):'время уточняется'}</div></div><div>${sections}</div>`;
  list.append(el);
 }
 const tags=[];
 if(!schedule||schedule.status==='unavailable'){
  tags.push('<span class="source-tag bad">Расписание недоступно</span>');
 }else{
  tags.push(schedule.source_live===true?'<span class="source-tag good">Excel: получен</span>':'<span class="source-tag warn">Excel: сохранённая версия</span>');
  tags.push(schedule.vk_ok===true?'<span class="source-tag good">VK: проверен</span>':'<span class="source-tag bad">VK: не проверен</span>');
 }
 $('verification').innerHTML=tags.join('');
 const review=(schedule?.notices||[]).filter(n=>n.date===selected || n.lesson_dates?.includes(selected));$('reviewSection').hidden=!review.length;$('reviewLabel').textContent=`Требуют проверки (${review.length})`;
 $('reviews').innerHTML=review.slice(0,30).map(x=>`<div class="review"><strong>${h(x.reason||'Изменение требует проверки')}</strong><p>${h(x.text||'')}</p>${x.url&&/^https:\/\/vk\.com\/wall-?\d+_\d+$/.test(x.url)?`<a target="_blank" rel="noopener" href="${x.url}">Посмотреть пост ↗</a>`:''}</div>`).join('');
 $('updated').textContent=schedule?.updated_at?`Версия расписания: ${new Date(schedule.updated_at).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',year:'numeric'})}`:'Расписание ещё не проверялось';
}
async function load(){try{
 const embedded=$('embedded-data');
 if(location.protocol==='file:'&&embedded){schedule=JSON.parse(embedded.textContent)}
 else {let response=await fetch('./schedule.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);schedule=await response.json()}
 if(schedule.group!=='ИОЗ-231')throw Error('Загружена неверная группа');
}catch(err){console.error(err);schedule={group:'ИОЗ-231',status:'unavailable',entries:[],notices:[]};}render()}



function haptic(){try{if(typeof navigator.vibrate==='function')navigator.vibrate(8)}catch{}}
function cancelCalendarAnimations(){
 for(const el of [$('calendarBody'),$('days')]){
  if(typeof el.getAnimations==='function')for(const a of el.getAnimations())if(a.id==='calendar-height'||a.id==='calendar-slide')a.cancel();
 }
}
function animateCalendar(direction,oldHeight){
 const days=$('days'),body=$('calendarBody');
 if(typeof days.animate!=='function'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const end=body.getBoundingClientRect().height;
 if(Number.isFinite(oldHeight)&&Math.abs(end-oldHeight)>1){
  const a=body.animate([{height:oldHeight+'px',overflow:'hidden'},{height:end+'px',overflow:'hidden'}],{duration:end>oldHeight?280:240,easing:'cubic-bezier(.2,.7,.2,1)'});a.id='calendar-height';
 }
 if(direction){
  const a=days.animate([{transform:'translateX('+(direction*18)+'px)',opacity:.72},{transform:'translateX(0)',opacity:1}],{duration:200,easing:'cubic-bezier(.2,.7,.2,1)'});a.id='calendar-slide';
 }
}
function prepareCalendarAnimation(){const height=$('calendarBody').getBoundingClientRect().height;cancelCalendarAnimations();return height}
function animateLessons(){
 const list=$('lessons');
 if(typeof list.animate==='function'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  for(const a of list.getAnimations?.()||[])if(a.id==='lesson-change')a.cancel();
  const a=list.animate([{opacity:.8},{opacity:1}],{duration:150,easing:'ease-out'});a.id='lesson-change';
 }
}
function selectDate(dt,restoreFocus=false){
 if(dt===selected&&!expanded)return;
 const height=prepareCalendarAnimation(),wasExpanded=expanded,changed=dt!==selected;
 selected=dt;expanded=false;viewMonth=selected.slice(0,7)+'-01';saveSelectedDate();if(changed)haptic();render();
 if(wasExpanded)animateCalendar(0,height);
 if(changed)animateLessons();
 if(restoreFocus)$('days').querySelector('[data-date="'+selected+'"]')?.focus({preventScroll:true});
}
function navigateWeek(delta){
 const height=prepareCalendarAnimation();
 selected=daysFrom(selected,7*delta);
 viewMonth=selected.slice(0,7)+'-01';saveSelectedDate();haptic();render();animateCalendar(delta,height);animateLessons();
}
function navigateMonth(delta,fromSwipe=false){
 if(!expanded)return;
 const height=prepareCalendarAnimation();
 viewMonth=monthShift(viewMonth,delta);
 if(fromSwipe)rememberMonthSwipe();
 renderCalendar();animateCalendar(delta,height);
}
function navigateSwipe(delta){
 if(expanded)navigateMonth(delta,true);
 else navigateWeek(delta);
}
$('prev').onclick=()=>navigateWeek(-1);
$('next').onclick=()=>navigateWeek(1);
$('today').onclick=()=>selectDate(todayMoscow());
$('monthPrev').onclick=()=>navigateMonth(-1);
$('monthNext').onclick=()=>navigateMonth(1);
function setMonthExpanded(value){
 if(expanded===value)return;
 const height=prepareCalendarAnimation();
 expanded=value;
 if(expanded)viewMonth=selected.slice(0,7)+'-01';
 renderCalendar();animateCalendar(0,height);
}
const monthButton=$('monthToggle'),handle=$('calendarHandle');
monthButton.onclick=()=>setMonthExpanded(!expanded);
let drag=null,skipHandleClickUntil=0;
handle.addEventListener('pointerdown',e=>{
 if(e.button!==0||!e.isPrimary)return;
 drag={id:e.pointerId,x:e.clientX,y:e.clientY};
 handle.setPointerCapture(e.pointerId);
});
handle.addEventListener('pointerup',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const dy=e.clientY-drag.y,dx=e.clientX-drag.x;drag=null;
 if(Math.abs(dy)>=25&&Math.abs(dy)>Math.abs(dx)){
  skipHandleClickUntil=Date.now()+400;setMonthExpanded(dy>0);
 }
});
handle.addEventListener('pointercancel',()=>{drag=null});
handle.addEventListener('lostpointercapture',()=>{drag=null});
handle.onclick=()=>{if(Date.now()>=skipHandleClickUntil)setMonthExpanded(!expanded)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&expanded){setMonthExpanded(false);monthButton.focus()}});
$('days').addEventListener('keydown',e=>{
 if(expanded&&(e.key==='PageUp'||e.key==='PageDown')){
  e.preventDefault();navigateMonth(e.key==='PageUp'?-1:1);
  const first=$('days').querySelector('.day:not(.outside)');first?.focus({preventScroll:true});return;
 }
 const current=e.target.closest('[data-date]');
 if(!current)return;
 const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
 if(!Object.hasOwn(offsets,e.key))return;
 const target=daysFrom(current.dataset.date,offsets[e.key]),next=$('days').querySelector('[data-date="'+target+'"]');
 if(next){e.preventDefault();next.focus({preventScroll:true})}
});
let swipe=null,suppressTapUntil=0;
$('days').addEventListener('touchstart',e=>{suppressTapUntil=0;swipe=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,axis:null}:null},{passive:true});
$('days').addEventListener('touchmove',e=>{
 if(!swipe||e.touches.length!==1){swipe=null;return}
 if(swipe.axis)return;
 const dx=Math.abs(e.touches[0].clientX-swipe.x),dy=Math.abs(e.touches[0].clientY-swipe.y);
 if(dy>12&&dy>=dx)swipe.axis='vertical';
 else if(dx>12&&dx>dy*1.5)swipe.axis='horizontal';
},{passive:true});
$('days').addEventListener('touchend',e=>{if(!swipe||e.changedTouches.length!==1){swipe=null;return}const t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y,axis=swipe.axis;swipe=null;if(axis!=='vertical'&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5){suppressTapUntil=Date.now()+350;navigateSwipe(dx<0?1:-1)}},{passive:true});
$('days').addEventListener('touchcancel',()=>{swipe=null},{passive:true});
$('days').addEventListener('click',e=>{if(e.detail!==0&&Date.now()<suppressTapUntil){e.preventDefault();e.stopPropagation()}},true);
$('refresh').onclick=load;load();
let lastCalendarToday=todayMoscow();
function updateCalendarToday(){
 const current=todayMoscow();if(current===lastCalendarToday)return;
 const wasToday=selected===lastCalendarToday&&!expanded;lastCalendarToday=current;
 if(wasToday){selected=current;viewMonth=current.slice(0,7)+'-01';saveSelectedDate();render()}
 else renderCalendar();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateCalendarToday()});
window.addEventListener('pageshow',updateCalendarToday);
setInterval(()=>{if(!document.hidden)updateCalendarToday()},60000);

/* Pull down at the top to reload both the page and its schedule. */
(function setupPullToRefresh(){
 const indicator=$('pullRefresh');
 const threshold=80;
 let gesture=null,reloading=false,ready=false;
 function reset(){
  gesture=null;ready=false;
  indicator.classList.remove('is-visible');
  indicator.textContent='';
 }
 document.addEventListener('touchstart',event=>{
  if(reloading)return;
  reset();
  if(event.touches.length!==1||window.scrollY>0)return;
  if(event.target.closest('input,textarea,select,[contenteditable],.calendar-section'))return;
  const touch=event.touches[0];
  gesture={x:touch.clientX,y:touch.clientY,distance:0,active:false};
 },{passive:true});
 document.addEventListener('touchmove',event=>{
  if(!gesture||reloading)return;
  if(event.touches.length!==1){reset();return;}
  const touch=event.touches[0],dx=touch.clientX-gesture.x,dy=touch.clientY-gesture.y;
  if(!gesture.active){
   if(window.scrollY>0||dy<0||Math.abs(dx)>12&&Math.abs(dx)>dy){reset();return;}
   if(dy<12||dy<=Math.abs(dx))return;
   gesture.active=true;
  }
  if(event.cancelable)event.preventDefault();
  gesture.distance=Math.max(0,dy);
  const nextReady=gesture.distance>=threshold;
  indicator.classList.toggle('is-visible',gesture.distance>12);
  if(indicator.textContent===''||ready!==nextReady){
   ready=nextReady;
   indicator.textContent=ready?'Отпустите для обновления ↻':'Потяните вниз для обновления ↓';
  }
 },{passive:false});
 document.addEventListener('touchend',event=>{
  if(event.touches.length)return;
  if(!gesture||!gesture.active||!ready){reset();return;}
  gesture=null;reloading=true;
  indicator.textContent='Обновляем страницу…';
  window.location.reload();
 },{passive:true});
 document.addEventListener('touchcancel',reset,{passive:true});
})();

</script>
</body></html>
